name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'build/Podman/**'
      - '.github/workflows/build-container.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'build/Podman/**'
      - '.github/workflows/build-container.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-slim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build slim image
        run: |
          docker build \
            -f ./build/Podman/Containerfile.slim \
            -t pipsin/cad2geant4:latest \
            ./build/Podman

      - name: Push slim image
        if: github.event_name != 'pull_request'
        run: docker push pipsin/cad2geant4:latest

  build-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for dev image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cadtogeant4
          tags: type=raw,value=dev

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: ./build/Podman
          file: ./build/Podman/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
